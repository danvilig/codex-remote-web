<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'"><title>Codex Remote Web</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="workspace.css"><link rel="stylesheet" href="remote-access.css"><link rel="stylesheet" href="desktop.css"><script type="module" src="renderer.js"></script></head>
<body class="remote-workspace desktop-workspace">
<aside class="desktop-sidebar"><div class="desktop-brand"><span id="brand" aria-hidden="true"></span><strong>Codex Remote Web</strong></div><p class="eyebrow" data-text="Your gateway, in the background."></p><nav aria-label="Settings"><button data-page="overview" aria-current="page" data-text="Overview"></button><button data-page="configuration" data-text="Gateway settings"></button><button data-page="remote" data-text="Remote access"></button><button data-page="diagnostics" data-text="Diagnostics"></button></nav><footer><span class="status-dot" id="sidebarDot"></span><span id="sidebarStatus"></span></footer></aside>
<main class="desktop-main"><header class="desktop-heading"><div><p class="eyebrow" data-text="DESKTOP GATEWAY"></p><h1 id="pageTitle"></h1></div><button id="openWorkspace" data-text="Open workspace"></button></header><p id="message" role="status" aria-live="polite"></p>
<section data-panel="overview"><article class="desktop-card hero"><span class="status-dot" id="gatewayDot"></span><h2 id="gatewayState"></h2><p id="gatewayDescription"></p><code id="localAddress"></code><div class="desktop-actions"><button class="primary" id="start" data-text="Start gateway"></button><button id="stop" data-text="Stop gateway"></button><button id="restart" data-text="Restart"></button></div></article><article class="desktop-card"><h2 data-text="Always available while you are signed in"></h2><p data-text="Close this window or quit the tray: your gateway keeps running. Signing out stops the background service."></p><button id="initialize" data-text="Initialize gateway"></button></article></section>
<section data-panel="configuration" hidden><form id="configuration" class="desktop-card"><h2 data-text="Initialize and configure"></h2><p data-text="Stop the gateway before changing its settings. Your existing Codex account and configuration are used."></p><label><span data-text="Project directory"></span><div class="path-field"><input name="cwd" required autocomplete="off"><button type="button" data-choose="chooseDirectory" data-field="cwd" data-text="Browse"></button></div></label><div class="desktop-grid"><label><span data-text="Local port"></span><input type="number" name="port" min="1024" max="65535" required></label><label><span data-text="Language"></span><select name="language"><option value="system" data-text="System"></option><option value="en">English</option><option value="zh">简体中文</option></select></label></div><label><span data-text="Codex executable (optional)"></span><div class="path-field"><input name="codex" autocomplete="off" placeholder="Auto-detect"><button type="button" data-choose="chooseCodex" data-field="codex" data-text="Browse"></button></div></label><label><span data-text="cloudflared executable (optional)"></span><div class="path-field"><input name="cloudflared" autocomplete="off" placeholder="Auto-detect"><button type="button" data-choose="chooseCloudflared" data-field="cloudflared" data-text="Browse"></button></div></label><label><span data-text="Appearance"></span><select name="theme"><option value="system" data-text="System"></option><option value="light" data-text="Light"></option><option value="dark" data-text="Dark"></option></select></label><label class="switch-row"><span data-text="Start gateway at login"></span><input type="checkbox" name="autostart"></label><label class="switch-row"><span data-text="Enable web terminal"></span><input type="checkbox" name="terminal"></label><p data-text="The web terminal runs with your user permissions. Enable it only when needed."></p><div class="desktop-actions"><button class="primary" type="submit" id="save" data-text="Save settings"></button><button type="button" id="checkDependencies" data-text="Check dependencies"></button></div></form><article class="desktop-card"><h2 data-text="Dependencies"></h2><ul id="dependencies"></ul><p data-text="Codex and Git are required. cloudflared is required only for remote access. Install missing tools or select their executable paths, then check again."></p><div class="desktop-actions"><a href="https://developers.openai.com/codex/cli" target="_blank" rel="noreferrer">Codex CLI ↗</a><a href="https://git-scm.com/downloads" target="_blank" rel="noreferrer">Git ↗</a><a href="https://developers.cloudflare.com/cloudflare-one/networks/connectors/cloudflare-tunnel/downloads/" target="_blank" rel="noreferrer">cloudflared ↗</a></div></article></section>
<section data-panel="remote" hidden><div id="remoteAccess"></div></section>
<section data-panel="diagnostics" hidden><article class="desktop-card"><h2 data-text="Background activity"></h2><p data-text="Lifecycle events only. Credentials and conversation contents are never shown here."></p><pre id="events" tabindex="0"></pre></article><article class="desktop-card"><h2 data-text="Background component"></h2><p data-text="Remove login startup and stop this application's background processes. Projects and credentials are preserved."></p><button class="danger" id="removeBackground" data-text="Stop and remove background component"></button></article></section>
</main></body></html>
