[package]
name = "codex-remote-web-desktop"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false

[dependencies]
open = "5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sys-locale = "0.3"
tauri = { version = "2.12", features = ["image-png", "tray-icon"] }
tauri-plugin-dialog = { version = "2", default-features = false, features = ["gtk3"] }
tauri-plugin-single-instance = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Threading"] }

[build-dependencies]
tauri-build = "2"

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = "s"
strip = true
