name: Publish platform release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to publish, for example v0.2.0-alpha.3
        required: true
        default: v0.2.0-alpha.3

permissions:
  contents: read
  actions: read

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  verify:
    name: Require passing Verify for the tagged commit
    runs-on: ubuntu-24.04
    outputs:
      revision: ${{ steps.gate.outputs.revision }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
      - id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          revision="$(git rev-parse HEAD)"
          # Only publish history promoted through protected main, after that
          # exact commit passed main's push Verify (not merely a feature run).
          git merge-base --is-ancestor "$revision" refs/remotes/origin/main
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${revision}&event=push" \
            --jq 'any(.workflow_runs[]; .path == ".github/workflows/ci.yml" and .head_branch == "main" and .conclusion == "success")' | grep -qx true
          echo "revision=${revision}" >> "$GITHUB_OUTPUT"
  build:
    needs: verify
    uses: ./.github/workflows/platform-packages.yml
    with:
      revision: ${{ needs.verify.outputs.revision }}
      tag: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

  publish:
    name: Publish GitHub Release
    needs: [verify, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify.outputs.revision }}
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: .artifacts/release
          merge-multiple: true
      - name: Validate release inputs
        run: |
          version="$(node -p "require('./package.json').version")"
          test "$RELEASE_TAG" = "v${version}"
          test "$(find .artifacts/release -maxdepth 1 \( -name '*.tar.gz' -o -name '*.zip' -o -name '*.dmg' -o -name '*.msi' \) | wc -l)" -eq 8
          test "$(find .artifacts/release -maxdepth 1 -name '*.sha256' | wc -l)" -eq 8
          cd .artifacts/release
          cat *.sha256 > SHA256SUMS
          sha256sum -c SHA256SUMS
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(node -p "require('./package.json').version")"
          gh release create "$RELEASE_TAG" \
            .artifacts/release/*.tar.gz \
            .artifacts/release/*.zip \
            .artifacts/release/*.dmg \
            .artifacts/release/*.msi \
            .artifacts/release/*.sha256 \
            .artifacts/release/SHA256SUMS \
            --repo "${GITHUB_REPOSITORY}" \
            --title "Codex Remote Web ${version}" \
            --notes-file "docs/releases/${version}.md" \
            --prerelease
