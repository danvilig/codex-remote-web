name: Publish Linux release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to publish, for example v0.2.0-alpha.2
        required: true
        default: v0.2.0-alpha.2

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  build:
    name: Build ${{ matrix.arch }} Linux package
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: npm_config_nodedir="$(dirname "$(dirname "$(readlink -f "$(command -v node)")")")" npm rebuild node-pty
      - run: bun run check
      - run: bun run test:unit
      - name: Build release archive
        run: |
          mkdir -p .artifacts/release
          bun scripts/release.ts --output-dir .artifacts/release
          version="$(node -p "require('./package.json').version")"
          archive=".artifacts/release/codex-remote-web-${version}.tar.gz"
          target=".artifacts/release/codex-remote-web-${version}-linux-${{ matrix.arch }}.tar.gz"
          mv "$archive" "$target"
          rm -f "$archive.sha256"
          sha256sum "$target" > "$target.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: release-linux-${{ matrix.arch }}
          path: .artifacts/release/codex-remote-web-*.tar.gz*
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/download-artifact@v4
        with:
          pattern: release-linux-*
          path: .artifacts/release
          merge-multiple: true
      - name: Validate release inputs
        run: |
          version="$(node -p "require('./package.json').version")"
          test "$RELEASE_TAG" = "v${version}"
          test "$(find .artifacts/release -maxdepth 1 -name '*.tar.gz' | wc -l)" -eq 2
          test "$(find .artifacts/release -maxdepth 1 -name '*.sha256' | wc -l)" -eq 2
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(node -p "require('./package.json').version")"
          gh release create "$RELEASE_TAG" \
            .artifacts/release/*.tar.gz \
            .artifacts/release/*.sha256 \
            --repo "${GITHUB_REPOSITORY}" \
            --title "Codex Remote Web ${version}" \
            --notes-file "docs/releases/${version}.md" \
            --prerelease
