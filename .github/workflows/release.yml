name: Publish platform release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing reviewed tag on main (for example v0.2.0-beta.2)
        required: true
      candidate_run:
        description: Completed Native platform packages run from main for this exact tag commit
        required: true
      macos27_manual_sha256:
        description: DMG SHA-256 personally verified on a macOS 27 Mac, only for a visible composite failure
        required: false
      macos27_manual_version:
        description: macOS 27 version and build from sw_vers, for example 27.0.1 (26A434)
        required: false

permissions:
  actions: read
  contents: read

concurrency:
  group: publish-platform-release
  cancel-in-progress: false

jobs:
  publish:
    name: Verify and publish the existing candidate
    if: github.ref == 'refs/heads/main' && github.actor == github.repository_owner && github.triggering_actor == github.repository_owner
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: Verify exact tag and candidate provenance
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          CANDIDATE_RUN: ${{ inputs.candidate_run }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-beta\.[0-9]+$ ]]
          [[ "$CANDIDATE_RUN" =~ ^[1-9][0-9]*$ ]]
          revision="$(git rev-parse --verify "refs/tags/${RELEASE_TAG}^{commit}")"
          test "$revision" = "$GITHUB_SHA"
          test "$RELEASE_TAG" = "v$(node -p 'require("./package.json").version')"
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${revision}&event=push" \
            --jq 'any(.workflow_runs[]; .path == ".github/workflows/ci.yml" and .head_branch == "main" and .conclusion == "success")' | grep -qx true
          mkdir -p "$RUNNER_TEMP/candidate"
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${CANDIDATE_RUN}" > "$RUNNER_TEMP/candidate/run.json"
          jq -e --arg sha "$revision" --arg repo "$GITHUB_REPOSITORY" '.head_sha == $sha and .head_repository.full_name == $repo and .head_branch == "main" and .path == ".github/workflows/platform-packages.yml" and (.event == "push" or .event == "workflow_dispatch") and .status == "completed" and .run_attempt == 1 and (.conclusion == "success" or .conclusion == "failure")' "$RUNNER_TEMP/candidate/run.json"
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${CANDIDATE_RUN}/attempts/1/jobs?per_page=100" > "$RUNNER_TEMP/candidate/jobs.json"
          gh run download "$CANDIDATE_RUN" --repo "$GITHUB_REPOSITORY" --pattern 'release-*' --pattern 'validation-macos-27-arm64' --dir "$RUNNER_TEMP/candidate"
      - name: Check exact package checksums and native acceptance
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          MACOS27_MANUAL_SHA256: ${{ inputs.macos27_manual_sha256 }}
          MACOS27_MANUAL_VERSION: ${{ inputs.macos27_manual_version }}
        run: node scripts/verify-platform-candidate.mjs "$RUNNER_TEMP/candidate" "$RELEASE_TAG" "$GITHUB_SHA"
      - name: Publish the verified artifacts without rebuilding
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          CANDIDATE_RUN: ${{ inputs.candidate_run }}
        run: |
          base="$RUNNER_TEMP/candidate"
          mapfile -t assets < "$base/assets.txt"
          test "${#assets[@]}" -eq 21
          notes="$base/release-notes.md"
          cp "docs/releases/${RELEASE_TAG#v}.md" "$notes"
          printf '\nCandidate CI: %s/%s/actions/runs/%s\n\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$CANDIDATE_RUN" >> "$notes"
          cat "$base/acceptance.md" >> "$notes"
          gh release create "$RELEASE_TAG" "${assets[@]}" --verify-tag --repo "$GITHUB_REPOSITORY" \
            --title "Codex Remote Web ${RELEASE_TAG#v}" --notes-file "$notes" --prerelease
